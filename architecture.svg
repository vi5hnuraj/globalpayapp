<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="680" fill="#080b0a"/>
  <text x="600" y="46" fill="#eafff4" font-size="27" font-weight="700" text-anchor="middle">GlobalPay architecture — NEAR testnet</text>
  <text x="600" y="72" fill="#7c958a" font-size="14" text-anchor="middle">Card possession + device biometrics authorize native NEAR transactions; rupees leave only through the payout rail.</text>

  <!-- Phone -->
  <rect x="40" y="110" width="290" height="420" rx="18" fill="#0e1713" stroke="#1f6f52" stroke-width="1.5"/>
  <text x="60" y="142" fill="#39e0a2" font-size="13" font-weight="700" letter-spacing="1.5">FLUTTER WALLET (ANDROID)</text>
  <g fill="#0a120f" stroke="#2b4a3d">
    <rect x="60" y="162" width="250" height="66" rx="10"/>
    <rect x="60" y="244" width="250" height="66" rx="10"/>
    <rect x="60" y="326" width="250" height="66" rx="10"/>
    <rect x="60" y="408" width="250" height="92" rx="10"/>
  </g>
  <g fill="#d8eee4" font-size="13">
    <text x="76" y="188">Contactless EMV card</text>
    <text x="76" y="207" fill="#7c958a" font-size="11">ISO-DEP read · DDA signature verified locally</text>
    <text x="76" y="270">Biometric gate</text>
    <text x="76" y="289" fill="#7c958a" font-size="11">strong prompt unwraps the Keystore key</text>
    <text x="76" y="352">Ed25519 account</text>
    <text x="76" y="371" fill="#7c958a" font-size="11">seed encrypted at rest, never sent to the backend</text>
    <text x="76" y="437">Screens</text>
    <text x="76" y="456" fill="#7c958a" font-size="11">home · send · receive · Pay UPI</text>
    <text x="76" y="475" fill="#7c958a" font-size="11">payout state · activity · card security</text>
  </g>

  <!-- Backend -->
  <rect x="390" y="110" width="330" height="420" rx="18" fill="#0e1713" stroke="#1f6f52" stroke-width="1.5"/>
  <text x="410" y="142" fill="#39e0a2" font-size="13" font-weight="700" letter-spacing="1.5">FASTAPI BACKEND</text>
  <g fill="#0a120f" stroke="#2b4a3d">
    <rect x="410" y="162" width="290" height="74" rx="10"/>
    <rect x="410" y="252" width="290" height="74" rx="10"/>
    <rect x="410" y="342" width="290" height="74" rx="10"/>
    <rect x="410" y="432" width="290" height="68" rx="10"/>
  </g>
  <g fill="#d8eee4" font-size="13">
    <text x="426" y="188">POST /near/quote</text>
    <text x="426" y="207" fill="#7c958a" font-size="11">validates the UPI QR · prices INR · returns lock args</text>
    <text x="426" y="278">POST /near/track</text>
    <text x="426" y="297" fill="#7c958a" font-size="11">re-reads the final tx from NEAR RPC and verifies it</text>
    <text x="426" y="368">Settler + payout runner</text>
    <text x="426" y="387" fill="#7c958a" font-size="11">PAID / FAILED / UNKNOWN · unknown freezes for a human</text>
    <text x="426" y="458">Receipt digest</text>
    <text x="426" y="477" fill="#7c958a" font-size="11">SHA-256 of payout id + UTR, UTR never stored</text>
  </g>

  <!-- NEAR -->
  <rect x="760" y="110" width="400" height="300" rx="18" fill="#0e1713" stroke="#39e0a2" stroke-width="1.5"/>
  <text x="780" y="142" fill="#39e0a2" font-size="13" font-weight="700" letter-spacing="1.5">NEAR TESTNET</text>
  <g fill="#0a120f" stroke="#2b4a3d">
    <rect x="780" y="162" width="360" height="58" rx="10"/>
    <rect x="780" y="234" width="172" height="76" rx="10"/>
    <rect x="968" y="234" width="172" height="76" rx="10"/>
    <rect x="780" y="324" width="360" height="58" rx="10"/>
  </g>
  <g fill="#d8eee4" font-size="13">
    <text x="796" y="188">usdc.fakes.testnet · USDC.e, 6 decimals</text>
    <text x="796" y="207" fill="#7c958a" font-size="11">explicitly a test asset</text>
    <text x="796" y="258">vault.globalpay-receipts</text>
    <text x="796" y="277" fill="#7c958a" font-size="11">ft_transfer_call lock</text>
    <text x="796" y="296" fill="#7c958a" font-size="11">refund · treasury settle</text>
    <text x="984" y="258">globalpay-receipts</text>
    <text x="984" y="277" fill="#7c958a" font-size="11">one digest per payment</text>
    <text x="984" y="296" fill="#7c958a" font-size="11">raw UTR rejected</text>
    <text x="796" y="350">treasury.globalpay-receipts.testnet</text>
    <text x="796" y="369" fill="#7c958a" font-size="11">settlement destination</text>
  </g>

  <!-- Merchant -->
  <rect x="760" y="440" width="400" height="120" rx="18" fill="#0e1713" stroke="#1f6f52" stroke-width="1.5"/>
  <text x="780" y="472" fill="#39e0a2" font-size="13" font-weight="700" letter-spacing="1.5">MERCHANT</text>
  <text x="780" y="504" fill="#d8eee4" font-size="13">RazorpayX UPI payout → merchant VPA</text>
  <text x="780" y="526" fill="#7c958a" font-size="11">production-gated; no live payout has been authorized</text>
  <text x="780" y="545" fill="#7c958a" font-size="11">the chain records a commitment, never the UTR</text>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" fill="#39e0a2">
      <path d="M0,0 L0,6 L9,3 z"/>
    </marker>
  </defs>
  <line x1="330" y1="200" x2="390" y2="200" stroke="#39e0a2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="330" y1="290" x2="390" y2="290" stroke="#39e0a2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="200" x2="760" y2="200" stroke="#39e0a2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="290" x2="780" y2="290" stroke="#39e0a2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="960" y1="410" x2="960" y2="440" stroke="#39e0a2" stroke-width="2" marker-end="url(#a)"/>

  <text x="46" y="580" fill="#7c958a" font-size="11">The card proves possession; the wallet key authorizes the transfer; the vault holds funds; the payout rail pays INR.</text>
  <text x="46" y="600" fill="#7c958a" font-size="11">No other chain, payout board or bank-acquirer integration is part of this path.</text>
</svg>

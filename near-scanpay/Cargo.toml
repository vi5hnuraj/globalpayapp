[package]
name = "globalpay-vault"
version = "0.1.0"
edition = "2021"
description = "Minimal callback-safe NEP-141 lock and refund escrow for the GlobalPay NEAR hackathon MVP."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.6.0"

[dev-dependencies]
near-sdk = { version = "5.6.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

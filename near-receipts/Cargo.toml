[package]
name = "globalpay-receipts"
version = "0.1.0"
edition = "2021"
description = "Anchors a digest of each settled GlobalPay payout on NEAR, so a merchant receipt can be proven later without publishing the UPI ID, the payee name or the UTR."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.6.0"

[dev-dependencies]
# Lets the contract be compiled and unit-tested for the host target. On-chain it is built with
# `cargo near build` instead, which sets the `near` cfg.
near-sdk = { version = "5.6.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

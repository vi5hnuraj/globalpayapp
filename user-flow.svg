<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="520" fill="#080b0a"/>
  <text x="600" y="46" fill="#eafff4" font-size="27" font-weight="700" text-anchor="middle">GlobalPay user flow</text>
  <text x="600" y="72" fill="#7c958a" font-size="14" text-anchor="middle">From tapping a card once, to paying any UPI QR from a NEAR wallet.</text>

  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" fill="#39e0a2">
      <path d="M0,0 L0,6 L9,3 z"/>
    </marker>
  </defs>

  <!-- steps -->
  <g>
    <rect x="40" y="110" width="250" height="120" rx="14" fill="#0e1713" stroke="#1f6f52"/>
    <text x="60" y="140" fill="#39e0a2" font-size="12" font-weight="700">1 · ONBOARD</text>
    <text x="60" y="166" fill="#d8eee4" font-size="13">Tap a contactless card</text>
    <text x="60" y="188" fill="#7c958a" font-size="11">ISO-DEP read and DDA check</text>
    <text x="60" y="205" fill="#7c958a" font-size="11">prove possession; then set</text>
    <text x="60" y="222" fill="#7c958a" font-size="11">a device biometric</text>
  </g>
  <g>
    <rect x="330" y="110" width="250" height="120" rx="14" fill="#0e1713" stroke="#1f6f52"/>
    <text x="350" y="140" fill="#39e0a2" font-size="12" font-weight="700">2 · WALLET</text>
    <text x="350" y="166" fill="#d8eee4" font-size="13">Ed25519 account is created</text>
    <text x="350" y="188" fill="#7c958a" font-size="11">seed encrypted with a</text>
    <text x="350" y="205" fill="#7c958a" font-size="11">biometric-bound AES-GCM key</text>
    <text x="350" y="222" fill="#7c958a" font-size="11">in Android Keystore</text>
  </g>
  <g>
    <rect x="620" y="110" width="250" height="120" rx="14" fill="#0e1713" stroke="#1f6f52"/>
    <text x="640" y="140" fill="#39e0a2" font-size="12" font-weight="700">3 · PAY</text>
    <text x="640" y="166" fill="#d8eee4" font-size="13">Scan any UPI QR</text>
    <text x="640" y="188" fill="#7c958a" font-size="11">the backend validates it and</text>
    <text x="640" y="205" fill="#7c958a" font-size="11">returns a private quote +</text>
    <text x="640" y="222" fill="#7c958a" font-size="11">ft_transfer_call arguments</text>
  </g>
  <g>
    <rect x="910" y="110" width="250" height="120" rx="14" fill="#0e1713" stroke="#1f6f52"/>
    <text x="930" y="140" fill="#39e0a2" font-size="12" font-weight="700">4 · AUTHORIZE</text>
    <text x="930" y="166" fill="#d8eee4" font-size="13">Biometric + signature</text>
    <text x="930" y="188" fill="#7c958a" font-size="11">the seed is decrypted only</text>
    <text x="930" y="205" fill="#7c958a" font-size="11">behind the prompt, then the</text>
    <text x="930" y="222" fill="#7c958a" font-size="11">tx is signed and sent</text>
  </g>

  <line x1="290" y1="170" x2="330" y2="170" stroke="#39e0a2" stroke-width="2" marker-end="url(#b)"/>
  <line x1="580" y1="170" x2="620" y2="170" stroke="#39e0a2" stroke-width="2" marker-end="url(#b)"/>
  <line x1="870" y1="170" x2="910" y2="170" stroke="#39e0a2" stroke-width="2" marker-end="url(#b)"/>

  <!-- second row -->
  <g>
    <rect x="40" y="300" width="250" height="130" rx="14" fill="#0e1713" stroke="#1f6f52"/>
    <text x="60" y="330" fill="#39e0a2" font-size="12" font-weight="700">5 · LOCK</text>
    <text x="60" y="356" fill="#d8eee4" font-size="13">USDC.e moves into the vault</text>
    <text x="60" y="378" fill="#7c958a" font-size="11">ft_transfer_call creates one</text>
    <text x="60" y="395" fill="#7c958a" font-size="11">lock; tokens are in escrow</text>
    <text x="60" y="412" fill="#7c958a" font-size="11">before the lock exists</text>
  </g>
  <g>
    <rect x="330" y="300" width="250" height="130" rx="14" fill="#0e1713" stroke="#1f6f52"/>
    <text x="350" y="330" fill="#39e0a2" font-size="12" font-weight="700">6 · VERIFY</text>
    <text x="350" y="356" fill="#d8eee4" font-size="13">Backend re-reads the chain</text>
    <text x="350" y="378" fill="#7c958a" font-size="11">/near/track checks the action,</text>
    <text x="350" y="395" fill="#7c958a" font-size="11">amount, lock id, vault and</text>
    <text x="350" y="412" fill="#7c958a" font-size="11">every receipt before recording</text>
  </g>
  <g>
    <rect x="620" y="300" width="250" height="130" rx="14" fill="#0e1713" stroke="#1f6f52"/>
    <text x="640" y="330" fill="#39e0a2" font-size="12" font-weight="700">7 · PAY MERCHANT</text>
    <text x="640" y="356" fill="#d8eee4" font-size="13">INR leaves through the rail</text>
    <text x="640" y="378" fill="#7c958a" font-size="11">RazorpayX pays the UPI VPA;</text>
    <text x="640" y="395" fill="#7c958a" font-size="11">a definite failure refunds, and</text>
    <text x="640" y="412" fill="#7c958a" font-size="11">an unknown stays frozen</text>
  </g>
  <g>
    <rect x="910" y="300" width="250" height="130" rx="14" fill="#0e1713" stroke="#1f6f52"/>
    <text x="930" y="330" fill="#39e0a2" font-size="12" font-weight="700">8 · RECORD</text>
    <text x="930" y="356" fill="#d8eee4" font-size="13">Receipt anchored on NEAR</text>
    <text x="930" y="378" fill="#7c958a" font-size="11">one SHA-256 digest per</text>
    <text x="930" y="395" fill="#7c958a" font-size="11">payment; UPI ids and UTRs</text>
    <text x="930" y="412" fill="#7c958a" font-size="11">stay off-chain</text>
  </g>

  <line x1="290" y1="365" x2="330" y2="365" stroke="#39e0a2" stroke-width="2" marker-end="url(#b)"/>
  <line x1="580" y1="365" x2="620" y2="365" stroke="#39e0a2" stroke-width="2" marker-end="url(#b)"/>
  <line x1="870" y1="365" x2="910" y2="365" stroke="#39e0a2" stroke-width="2" marker-end="url(#b)"/>
  <path d="M1035 230 L1035 300" fill="none" stroke="#39e0a2" stroke-width="2" marker-end="url(#b)"/>

  <text x="40" y="472" fill="#7c958a" font-size="11">A locked payment is not proof that the merchant was paid. The payer result and the payout rail remain the authorities.</text>
</svg>
